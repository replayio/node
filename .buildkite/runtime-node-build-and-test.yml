# NodeBKWiring build/test steps (PipelineYamlHome).
# Emitted by replay_build_scripts/build-pipeline.py (bakes pin SHA from
# node REPLAY_BACKEND_REV into the PIN_TOKEN placeholders).
# ${BUILDKITE_*} remain for Buildkite interpolation at PipelineUpload.
#
# Scratch dirs: mktemp under /tmp (BK agents are partially stateful).
# Do not parallel-clone node into a BK artifact — different agents cannot share
# disk; tar upload/download of the tree is pure waste. build_node_builder clones.
#
# NodeRepo: host checkout+out mounted over the image node path so make can
# incremental-rebuild across jobs on the same agent. Mounting only out/ is not
# enough — a fresh image COPY of sources resets mtimes and forces a full rebuild.
steps:
  - trigger: "build-driver-linker"
    key: "build-driver-linker"
    build:
      commit: "__REPLAY_BACKEND_REV__"
      message: "Triggered from node: ${BUILDKITE_MESSAGE}"

  # Plain command — do not use replay-deploy-buildkite-plugin (that emits
  # "Deploy to <branch> environment" / preprod steps; wrong for PR CI).
  - label: ":bust_in_silhouette: Build node"
    key: "build-node-linux"
    # BK default is 60m; cold node make -j4 exceeds that (see build #12).
    timeout_in_minutes: 120
    depends_on:
      - "build-driver-linker"
    agents:
      - "deploy=true"
      - "size=large"
    plugins:
      - seek-oss/aws-sm#v2.3.1:
          region: us-east-2
          env:
            ACCESS_KEY_ID:
              secret-id: "prod/deploy-access-keys"
              json-key: ".aws_access_key_id"
            SECRET_ACCESS_KEY:
              secret-id: "prod/deploy-access-keys"
              json-key: ".aws_secret_access_key"
    command: |
      set -euo pipefail
      export DOCKER_BUILDKIT=1
      PIN="__REPLAY_BACKEND_REV__"
      WORKDIR=$$(mktemp -d "/tmp/build-node-$${BUILDKITE_JOB_ID}.XXXXXX")
      trap 'rm -rf "$$WORKDIR"' EXIT
      BACKEND_DIR="$$WORKDIR/backend"
      mkdir -p "$$BACKEND_DIR"
      git -C "$$BACKEND_DIR" init
      git -C "$$BACKEND_DIR" remote add origin git@github.com:replayio/backend.git
      git -C "$$BACKEND_DIR" fetch --depth 1 origin "$$PIN"
      git -C "$$BACKEND_DIR" checkout FETCH_HEAD
      cd "$$BACKEND_DIR"
      BUILDKITE_DOCKER_ENVS=$$(env | awk -F= '/^BUILDKITE/{printf "-e %s ", $$1}')
      BUILDKITE_AGENT_BIN="$$(command -v buildkite-agent)"
      REPLAYIO_NODE_REF="$$BUILDKITE_COMMIT" ./scripts/docker/build_node_builder
      NODE_REPO="/var/lib/buildkite-agent/cache/runtime-node-build/repo"
      mkdir -p "$$NODE_REPO"
      reclaim_node_repo() {
        docker run --rm \
          -v "$$NODE_REPO:/repo" \
          --entrypoint chown \
          linux-node-build \
          -R "$$(id -u):$$(id -g)" /repo
      }
      reclaim_node_repo
      if [ ! -d "$$NODE_REPO/.git" ]; then
        git clone git@github.com:replayio/node.git "$$NODE_REPO"
      fi
      git -C "$$NODE_REPO" fetch --depth 1 origin "$$BUILDKITE_COMMIT"
      git -C "$$NODE_REPO" checkout -f --detach FETCH_HEAD
      docker run --rm \
        $$BUILDKITE_DOCKER_ENVS \
        -e ACCESS_KEY_ID \
        -e SECRET_ACCESS_KEY \
        -e AWS_ACCESS_KEY_ID="$$ACCESS_KEY_ID" \
        -e AWS_SECRET_ACCESS_KEY="$$SECRET_ACCESS_KEY" \
        -v "$$BUILDKITE_AGENT_BIN:/usr/local/bin/buildkite-agent:ro" \
        -v "$$NODE_REPO:/usr/build/tmp/replayio-node-repo" \
        linux-node-build
      reclaim_node_repo

  - label: "test-suite"
    key: "node-test-suite"
    depends_on:
      - "build-node-linux"
    agents:
      - "deploy=true"
    plugins:
      - seek-oss/aws-sm#v2.3.1:
          region: us-east-2
          env:
            ACCESS_KEY_ID:
              secret-id: "prod/deploy-access-keys"
              json-key: ".aws_access_key_id"
            SECRET_ACCESS_KEY:
              secret-id: "prod/deploy-access-keys"
              json-key: ".aws_secret_access_key"
    command: |
      set -euo pipefail
      PIN="__REPLAY_BACKEND_REV__"
      WORKDIR=$$(mktemp -d "/tmp/node-test-suite-$${BUILDKITE_JOB_ID}.XXXXXX")
      trap 'rm -rf "$$WORKDIR"' EXIT
      BACKEND_DIR="$$WORKDIR/backend"
      mkdir -p "$$BACKEND_DIR"
      git -C "$$BACKEND_DIR" init
      git -C "$$BACKEND_DIR" remote add origin git@github.com:replayio/backend.git
      git -C "$$BACKEND_DIR" fetch --depth 1 origin "$$PIN"
      git -C "$$BACKEND_DIR" checkout FETCH_HEAD
      buildkite-agent artifact download build_id "$$WORKDIR/"
      BUILD_ID="$$(cat "$$WORKDIR/build_id")"
      cd "$$BACKEND_DIR"
      npm ci --prefer-offline --progress=false
      npx tsx src/build/buildNode.ts test-suite --build-id "$$BUILD_ID"

  - label: "test-jest"
    key: "node-test-jest"
    depends_on:
      - "build-node-linux"
    agents:
      - "deploy=true"
    plugins:
      - seek-oss/aws-sm#v2.3.1:
          region: us-east-2
          env:
            ACCESS_KEY_ID:
              secret-id: "prod/deploy-access-keys"
              json-key: ".aws_access_key_id"
            SECRET_ACCESS_KEY:
              secret-id: "prod/deploy-access-keys"
              json-key: ".aws_secret_access_key"
    command: |
      set -euo pipefail
      PIN="__REPLAY_BACKEND_REV__"
      WORKDIR=$$(mktemp -d "/tmp/node-test-jest-$${BUILDKITE_JOB_ID}.XXXXXX")
      trap 'rm -rf "$$WORKDIR"' EXIT
      BACKEND_DIR="$$WORKDIR/backend"
      mkdir -p "$$BACKEND_DIR"
      git -C "$$BACKEND_DIR" init
      git -C "$$BACKEND_DIR" remote add origin git@github.com:replayio/backend.git
      git -C "$$BACKEND_DIR" fetch --depth 1 origin "$$PIN"
      git -C "$$BACKEND_DIR" checkout FETCH_HEAD
      buildkite-agent artifact download build_id "$$WORKDIR/"
      BUILD_ID="$$(cat "$$WORKDIR/build_id")"
      cd "$$BACKEND_DIR"
      npm ci --prefer-offline --progress=false
      npx tsx src/build/buildNode.ts test-jest --build-id "$$BUILD_ID"
