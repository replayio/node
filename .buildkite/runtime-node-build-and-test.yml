# NodeBKWiring build/test steps (PipelineYamlHome).
# Emitted by replay_build_scripts/build-pipeline.py (bakes pin SHA from
# node REPLAY_BACKEND_REV into the PIN_TOKEN placeholders).
# ${BUILDKITE_*} remain for Buildkite interpolation at PipelineUpload.
#
# Scratch dirs: always mktemp under /tmp (BK agents are partially stateful;
# skip-checkout reuses the pipeline workdir — never init git into a sticky path).
steps:
  - trigger: "build-driver-linker"
    key: "build-driver-linker"
    build:
      commit: "__REPLAY_BACKEND_REV__"
      message: "Triggered from node: ${BUILDKITE_MESSAGE}"

  # Parallel with build-driver-linker: shallow clone for build_node_builder (REPLAYIO_NODE_DIR).
  - label: "Clone node"
    key: "clone-node"
    agents:
      - "deploy=true"
    plugins:
      - thedyrt/skip-checkout#v0.1.1: ~
    command: |
      set -euo pipefail
      WORKDIR=$$(mktemp -d "/tmp/clone-node-$${BUILDKITE_JOB_ID}.XXXXXX")
      trap 'rm -rf "$$WORKDIR"' EXIT
      mkdir "$$WORKDIR/node-src"
      git -C "$$WORKDIR/node-src" init
      git -C "$$WORKDIR/node-src" remote add origin git@github.com:replayio/node.git
      git -C "$$WORKDIR/node-src" fetch --depth 1 origin "$$BUILDKITE_COMMIT"
      git -C "$$WORKDIR/node-src" checkout FETCH_HEAD
      tar czf "$$WORKDIR/node-src.tgz" -C "$$WORKDIR/node-src" .
      # Upload basename so downloaders can use `node-src.tgz` (not an abs path).
      buildkite-agent artifact upload "$$WORKDIR/node-src.tgz;node-src.tgz"

  # Plain command — do not use replay-deploy-buildkite-plugin (that emits
  # "Deploy to <branch> environment" / preprod steps; wrong for PR CI).
  - label: ":bust_in_silhouette: Build node"
    key: "build-node-linux"
    depends_on:
      - "build-driver-linker"
      - "clone-node"
    agents:
      - "deploy=true"
      - "size=large"
    plugins:
      - seek-oss/aws-sm#v2.3.1:
          region: us-east-2
          env:
            ACCESS_KEY_ID:
              secret-id: "prod/deploy-access-keys"
              json-key: ".aws_access_key_id"
            SECRET_ACCESS_KEY:
              secret-id: "prod/deploy-access-keys"
              json-key: ".aws_secret_access_key"
    command: |
      set -euo pipefail
      export DOCKER_BUILDKIT=1
      PIN="__REPLAY_BACKEND_REV__"
      WORKDIR=$$(mktemp -d "/tmp/build-node-$${BUILDKITE_JOB_ID}.XXXXXX")
      trap 'rm -rf "$$WORKDIR"' EXIT
      BACKEND_DIR="$$WORKDIR/backend"
      NODE_SRC="$$WORKDIR/node-src"
      mkdir -p "$$BACKEND_DIR" "$$NODE_SRC"
      git -C "$$BACKEND_DIR" init
      git -C "$$BACKEND_DIR" remote add origin git@github.com:replayio/backend.git
      git -C "$$BACKEND_DIR" fetch --depth 1 origin "$$PIN"
      git -C "$$BACKEND_DIR" checkout FETCH_HEAD
      buildkite-agent artifact download node-src.tgz "$$WORKDIR/"
      tar xzf "$$WORKDIR/node-src.tgz" -C "$$NODE_SRC"
      cd "$$BACKEND_DIR"
      BUILDKITE_DOCKER_ENVS=$$(env | awk -F= '/^BUILDKITE/{printf "-e %s ", $$1}')
      BUILDKITE_AGENT_BIN="$$(command -v buildkite-agent)"
      REPLAYIO_NODE_DIR="$$NODE_SRC" ./scripts/docker/build_node_builder
      docker run --rm \
        $$BUILDKITE_DOCKER_ENVS \
        -e ACCESS_KEY_ID \
        -e SECRET_ACCESS_KEY \
        -e AWS_ACCESS_KEY_ID="$$ACCESS_KEY_ID" \
        -e AWS_SECRET_ACCESS_KEY="$$SECRET_ACCESS_KEY" \
        -v "$$BUILDKITE_AGENT_BIN:/usr/local/bin/buildkite-agent:ro" \
        linux-node-build

  - label: "test-suite"
    key: "node-test-suite"
    depends_on:
      - "build-node-linux"
    agents:
      - "deploy=true"
    plugins:
      - seek-oss/aws-sm#v2.3.1:
          region: us-east-2
          env:
            ACCESS_KEY_ID:
              secret-id: "prod/deploy-access-keys"
              json-key: ".aws_access_key_id"
            SECRET_ACCESS_KEY:
              secret-id: "prod/deploy-access-keys"
              json-key: ".aws_secret_access_key"
    command: |
      set -euo pipefail
      PIN="__REPLAY_BACKEND_REV__"
      WORKDIR=$$(mktemp -d "/tmp/node-test-suite-$${BUILDKITE_JOB_ID}.XXXXXX")
      trap 'rm -rf "$$WORKDIR"' EXIT
      BACKEND_DIR="$$WORKDIR/backend"
      mkdir -p "$$BACKEND_DIR"
      git -C "$$BACKEND_DIR" init
      git -C "$$BACKEND_DIR" remote add origin git@github.com:replayio/backend.git
      git -C "$$BACKEND_DIR" fetch --depth 1 origin "$$PIN"
      git -C "$$BACKEND_DIR" checkout FETCH_HEAD
      buildkite-agent artifact download build_id "$$WORKDIR/"
      BUILD_ID="$$(cat "$$WORKDIR/build_id")"
      cd "$$BACKEND_DIR"
      npm ci --prefer-offline --progress=false
      npx tsx src/build/buildNode.ts test-suite --build-id "$$BUILD_ID"

  - label: "test-jest"
    key: "node-test-jest"
    depends_on:
      - "build-node-linux"
    agents:
      - "deploy=true"
    plugins:
      - seek-oss/aws-sm#v2.3.1:
          region: us-east-2
          env:
            ACCESS_KEY_ID:
              secret-id: "prod/deploy-access-keys"
              json-key: ".aws_access_key_id"
            SECRET_ACCESS_KEY:
              secret-id: "prod/deploy-access-keys"
              json-key: ".aws_secret_access_key"
    command: |
      set -euo pipefail
      PIN="__REPLAY_BACKEND_REV__"
      WORKDIR=$$(mktemp -d "/tmp/node-test-jest-$${BUILDKITE_JOB_ID}.XXXXXX")
      trap 'rm -rf "$$WORKDIR"' EXIT
      BACKEND_DIR="$$WORKDIR/backend"
      mkdir -p "$$BACKEND_DIR"
      git -C "$$BACKEND_DIR" init
      git -C "$$BACKEND_DIR" remote add origin git@github.com:replayio/backend.git
      git -C "$$BACKEND_DIR" fetch --depth 1 origin "$$PIN"
      git -C "$$BACKEND_DIR" checkout FETCH_HEAD
      buildkite-agent artifact download build_id "$$WORKDIR/"
      BUILD_ID="$$(cat "$$WORKDIR/build_id")"
      cd "$$BACKEND_DIR"
      npm ci --prefer-offline --progress=false
      npx tsx src/build/buildNode.ts test-jest --build-id "$$BUILD_ID"
