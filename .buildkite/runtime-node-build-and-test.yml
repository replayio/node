# NodeBKWiring build/test steps (PipelineYamlHome).
# Emitted by replay_build_scripts/build-pipeline.py (bakes pin SHA from
# node REPLAY_BACKEND_REV into the PIN_TOKEN placeholders).
# ${BUILDKITE_*} remain for Buildkite interpolation at PipelineUpload.
#
# Scratch dirs: mktemp under /tmp (BK agents are partially stateful).
# Do not parallel-clone node into a BK artifact — different agents cannot share
# disk; tar upload/download of the tree is pure waste. build_node_builder clones.
#
# NodeRepo: host checkout+out mounted over the image node path so ninja can
# incremental-rebuild across jobs on the same agent. Mounting only out/ is not
# enough — a fresh image COPY of sources resets mtimes and forces a full rebuild.
# Do not `git fetch --depth 1` the cached NodeRepo — shallow fetch rewrites the
# tree and bumps every source mtime → near-full rebuild.
# reclaim_node_repo chown -R bumps ctime on every file; with default git stat
# checks that dirties the whole tree and `checkout -f` rewrites all sources.
# core.trustctime=false + update-index --refresh after chown keeps mtimes.
steps:
  - trigger: "build-driver-linker"
    key: "build-driver-linker"
    build:
      commit: "__REPLAY_BACKEND_REV__"
      message: "Triggered from node: ${BUILDKITE_MESSAGE}"

  # Toolchain image for the node build: EngFlow's worker image, and the base of
  # backend's linux-node-build image that runs the rest of the build.
  # Built + pushed only when replay_build_scripts/rbe/Dockerfile changes (the
  # tag is its hash); otherwise this only checks the tag exists. Public on ECR
  # Public (public.ecr.aws/z3x5l6b1/node-rbe-toolchain) so EngFlow can pull it
  # like Chromium's gcr worker image. Pushes with the agent's AWS identity.
  - label: ":docker: RBE toolchain image"
    key: "build-rbe-toolchain-image"
    agents:
      - "build-runtime=true"
    command: "replay_build_scripts/rbe/toolchain-image.sh ensure"

  # Plain command — do not use replay-deploy-buildkite-plugin (that emits
  # "Deploy to <branch> environment" / preprod steps; wrong for PR CI).
  # Compiles run remotely on EngFlow (replay_build_scripts/rbe); configure, host
  # tools and the link run here, in backend's linux-node-build image, which
  # build_node_builder builds FROM node's toolchain image (same gcc as EngFlow).
  - label: ":bust_in_silhouette: Build node"
    key: "build-node-linux"
    timeout_in_minutes: 60
    # AgentLost exit_status:-1 (BK #102 mid-make) is intermittent infra — auto-retry.
    retry:
      automatic:
        - exit_status: -1
          limit: 2
    depends_on:
      - "build-driver-linker"
      - "build-rbe-toolchain-image"
    agents:
      - "build-runtime=true"
    plugins:
      - seek-oss/aws-sm#v2.3.1:
          region: us-east-2
          # EngFlow client cert, same secrets as Chromium's build.
          file:
            - path: "engflow.crt"
              secret-id: engflow-certificate
            - path: "engflow.key"
              secret-id: engflow-key
    # Chromium twin: artifact_paths collects build_id for downstream test steps.
    artifact_paths:
      - "build_id"
      - "rbe-logs/**/*"
    command: |
      set -euo pipefail
      export DOCKER_BUILDKIT=1
      echo "=== Disk space (build start) ==="
      df -h
      # One cached checkout + out/ per Node version: out/Release/build.ninja is
      # generated from the tree's .gyp files, so a checkout shared between Node
      # lines (e.g. 16.14.3 master and 16.20.3 rewrites) would rebuild everything
      # whenever CI switches between them. The step runs in the Buildkite checkout
      # of $$BUILDKITE_COMMIT, so read the version from there. (rbe-repo-*: the old
      # make builds' repo-* checkouts are no longer used.)
      NODE_VERSION=$$(awk '/^#define NODE_(MAJOR|MINOR|PATCH)_VERSION /{v = v (v ? "." : "") $$3} END {print v}' src/node_version.h)
      test -n "$$NODE_VERSION"
      NODE_REPO="/var/lib/buildkite-agent/cache/runtime-node-build/rbe-repo-$$NODE_VERSION"
      ENGFLOW="$$PWD"
      if [ -d "$$NODE_REPO" ]; then
        du -sh "$$NODE_REPO" "$$NODE_REPO/out" 2>/dev/null || du -sh "$$NODE_REPO" 2>/dev/null || true
      fi
      PIN="__REPLAY_BACKEND_REV__"
      WORKDIR=$$(mktemp -d "/tmp/build-node-$${BUILDKITE_JOB_ID}.XXXXXX")
      # The EngFlow cert/key (aws-sm plugin) must not outlive the job, whatever fails.
      trap 'rm -f "$$ENGFLOW/engflow.crt" "$$ENGFLOW/engflow.key"; rm -rf "$$WORKDIR"' EXIT
      BACKEND_DIR="$$WORKDIR/backend"
      mkdir -p "$$BACKEND_DIR"
      git -C "$$BACKEND_DIR" init
      git -C "$$BACKEND_DIR" remote add origin git@github.com:replayio/backend.git
      git -C "$$BACKEND_DIR" fetch --depth 1 origin "$$PIN"
      git -C "$$BACKEND_DIR" checkout FETCH_HEAD
      cd "$$BACKEND_DIR"
      BUILDKITE_DOCKER_ENVS=$$(env | awk -F= '/^BUILDKITE/{printf "-e %s ", $$1}')
      BUILDKITE_AGENT_BIN="$$(command -v buildkite-agent)"
      REPLAYIO_NODE_REF="$$BUILDKITE_COMMIT" ./scripts/docker/build_node_builder
      mkdir -p "$$NODE_REPO"
      reclaim_node_repo() {
        docker run --rm \
          -v "$$NODE_REPO:/repo" \
          --entrypoint chown \
          linux-node-build \
          -R "$$(id -u):$$(id -g)" /repo
      }
      reclaim_node_repo
      collect_logs() {
        mkdir -p "$$ENGFLOW/rbe-logs"
        cp -r "$$NODE_REPO/out/Release/.reproxy_tmp/logs" "$$ENGFLOW/rbe-logs/" 2>/dev/null || true
        cp "$$NODE_REPO/out/Release/.ninja_log" "$$ENGFLOW/rbe-logs/" 2>/dev/null || true
      }
      trap 'rm -f "$$ENGFLOW/engflow.crt" "$$ENGFLOW/engflow.key"; reclaim_node_repo; collect_logs; rm -rf "$$WORKDIR"' EXIT
      if [ ! -d "$$NODE_REPO/.git" ]; then
        git clone git@github.com:replayio/node.git "$$NODE_REPO"
      elif [ -f "$$NODE_REPO/.git/shallow" ]; then
        # Prior jobs used --depth 1; unshallow once so later checkouts keep mtimes.
        git -C "$$NODE_REPO" fetch --unshallow origin || git -C "$$NODE_REPO" fetch --deepen=2147483647 origin
      fi
      # chown -R (reclaim) bumps ctime; without this, checkout -f rewrites all files.
      git -C "$$NODE_REPO" config core.trustctime false
      git -C "$$NODE_REPO" update-index --refresh || true
      git -C "$$NODE_REPO" fetch origin "$$BUILDKITE_COMMIT"
      echo "=== NodeRepo sync (HEAD -> $$BUILDKITE_COMMIT) ==="
      echo "HEAD=$$(git -C "$$NODE_REPO" rev-parse HEAD 2>/dev/null || echo none)"
      echo "dirty=$$(git -C "$$NODE_REPO" status --porcelain 2>/dev/null | wc -l)"
      echo "diff_files=$$(git -C "$$NODE_REPO" diff --name-only HEAD "$$BUILDKITE_COMMIT" 2>/dev/null | wc -l)"
      git -C "$$NODE_REPO" checkout -f --detach "$$BUILDKITE_COMMIT"
      # build-rbe.py rebuilds out/Release from scratch when the toolchain image
      # changes (and removes a leftover make build).
      # Match build-node.yml: do not inject prod/deploy-access-keys (github-backend)
      # into the container — that IAM user cannot s3:PutObject builds/. build-runtime
      # EC2s (beefiermaster / runner-*) docker uses the agent identity (same as the
      # manual build-node pipeline).
      # safe.directory is set inside the image (run_node_build.sh / buildNodeDirectly).
      # REPLAY_RBE_REQUIRE_REMOTE: fail instead of silently compiling locally when
      # remote execution doesn't work (e.g. EngFlow can't pull the worker image).
      docker run --rm \
        $$BUILDKITE_DOCKER_ENVS \
        -v "$$BUILDKITE_AGENT_BIN:/usr/local/bin/buildkite-agent:ro" \
        -e RBE_service=simpsonite.cluster.engflow.com:443 \
        -e RBE_service_no_auth=true \
        -e RBE_use_application_default_credentials=true \
        -e RBE_tls_client_auth_cert=/engflow/engflow.crt \
        -e RBE_tls_client_auth_key=/engflow/engflow.key \
        -e REPLAY_RBE_REQUIRE_REMOTE=1 \
        -v "$$ENGFLOW/engflow.crt:/engflow/engflow.crt:ro" \
        -v "$$ENGFLOW/engflow.key:/engflow/engflow.key:ro" \
        -v "$$NODE_REPO:/usr/build/tmp/replayio-node-repo" \
        linux-node-build
      # Publish BuildId for test-node-recording / test-node-core / test-jest-repos (same role as chromium build_id/**).
      BUILD_ID=$$(sed -n 's/.*gBuildId\[\] = "\([^"]*\)".*/\1/p' "$$NODE_REPO/src/node_record_replay_driver.cc" | head -n1)
      test -n "$$BUILD_ID"
      echo "$$BUILD_ID" > "$${BUILDKITE_BUILD_CHECKOUT_PATH}/build_id"
      echo "BuildId=$$BUILD_ID"

  - label: "test-node-recording"
    key: "node-test-node-recording"
    depends_on:
      - "build-node-linux"
    agents:
      - "can_replay=true"
    plugins:
      - seek-oss/aws-sm#v2.3.1:
          region: us-east-2
          env:
            HASURA_ADMIN_SECRET: "prod/hasura-admin-secret"
            RECORD_REPLAY_API_KEY: "prod/public-api-key"
    command: |
      set -euo pipefail
      PIN="__REPLAY_BACKEND_REV__"
      WORKDIR=$$(mktemp -d "/tmp/node-test-node-recording-$${BUILDKITE_JOB_ID}.XXXXXX")
      BACKEND_DIR="$$WORKDIR/backend"
      mkdir -p "$$BACKEND_DIR"
      git -C "$$BACKEND_DIR" init
      git -C "$$BACKEND_DIR" remote add origin git@github.com:replayio/backend.git
      git -C "$$BACKEND_DIR" fetch --depth 1 origin "$$PIN"
      git -C "$$BACKEND_DIR" checkout FETCH_HEAD
      # LinkerZombieLeak: sweep before tests + always after (even on failure).
      "$$BACKEND_DIR/scripts/kill-linker-processes.sh"
      trap '"$$BACKEND_DIR/scripts/kill-linker-processes.sh"; rm -rf "$$WORKDIR"' EXIT
      buildkite-agent artifact download build_id "$$WORKDIR/"
      BUILD_ID="$$(cat "$$WORKDIR/build_id")"
      test -n "$$BUILD_ID"
      cd "$$BACKEND_DIR"
      unset REPLAY_LOCAL_DRIVER_DIR || true
      # packageManager pnpm@10.11.0; can_replay agents lack global npm write (EACCES).
      # Backend k8s image preinstalls pnpm; here use npx (Node 25 dropped corepack).
      npx --yes pnpm@10.11.0 install --frozen-lockfile
      # test/node-recording vitest suite; it sets the assert env vars itself.
      npx tsx src/build/buildNode.ts test-node-recording --build-id "$$BUILD_ID"

  - label: "test-node-core"
    key: "node-test-node-core"
    depends_on:
      - "build-node-linux"
    agents:
      - "can_replay=true"
    plugins:
      - seek-oss/aws-sm#v2.3.1:
          region: us-east-2
          env:
            HASURA_ADMIN_SECRET: "prod/hasura-admin-secret"
            RECORD_REPLAY_API_KEY: "prod/public-api-key"
    command: |
      set -euo pipefail
      PIN="__REPLAY_BACKEND_REV__"
      WORKDIR=$$(mktemp -d "/tmp/node-test-node-core-$${BUILDKITE_JOB_ID}.XXXXXX")
      BACKEND_DIR="$$WORKDIR/backend"
      mkdir -p "$$BACKEND_DIR"
      git -C "$$BACKEND_DIR" init
      git -C "$$BACKEND_DIR" remote add origin git@github.com:replayio/backend.git
      git -C "$$BACKEND_DIR" fetch --depth 1 origin "$$PIN"
      git -C "$$BACKEND_DIR" checkout FETCH_HEAD
      # LinkerZombieLeak: sweep before tests + always after (even on failure).
      "$$BACKEND_DIR/scripts/kill-linker-processes.sh"
      trap '"$$BACKEND_DIR/scripts/kill-linker-processes.sh"; rm -rf "$$WORKDIR"' EXIT
      buildkite-agent artifact download build_id "$$WORKDIR/"
      BUILD_ID="$$(cat "$$WORKDIR/build_id")"
      test -n "$$BUILD_ID"
      cd "$$BACKEND_DIR"
      unset REPLAY_LOCAL_DRIVER_DIR || true
      # packageManager pnpm@10.11.0; can_replay agents lack global npm write (EACCES).
      # Backend k8s image preinstalls pnpm; here use npx (Node 25 dropped corepack).
      npx --yes pnpm@10.11.0 install --frozen-lockfile
      export RECORD_REPLAY_ENABLE_ASSERTS=1
      export RECORD_REPLAY_JS_PROGRESS_ASSERTS=1
      # Random tests read node's test/ tree via nodePath().
      export RECORD_REPLAY_NODE_PATH="$$BUILDKITE_BUILD_CHECKOUT_PATH"
      test -d "$$RECORD_REPLAY_NODE_PATH/test"
      npx tsx src/build/buildNode.ts test-node-core --build-id "$$BUILD_ID"

  - label: "test-jest-repos"
    key: "node-test-jest-repos"
    depends_on:
      - "build-node-linux"
    agents:
      - "can_replay=true"
    plugins:
      - seek-oss/aws-sm#v2.3.1:
          region: us-east-2
          env:
            HASURA_ADMIN_SECRET: "prod/hasura-admin-secret"
            RECORD_REPLAY_API_KEY: "prod/public-api-key"
    command: |
      set -euo pipefail
      PIN="__REPLAY_BACKEND_REV__"
      WORKDIR=$$(mktemp -d "/tmp/node-test-jest-repos-$${BUILDKITE_JOB_ID}.XXXXXX")
      BACKEND_DIR="$$WORKDIR/backend"
      mkdir -p "$$BACKEND_DIR"
      git -C "$$BACKEND_DIR" init
      git -C "$$BACKEND_DIR" remote add origin git@github.com:replayio/backend.git
      git -C "$$BACKEND_DIR" fetch --depth 1 origin "$$PIN"
      git -C "$$BACKEND_DIR" checkout FETCH_HEAD
      # LinkerZombieLeak: sweep before tests + always after (even on failure).
      "$$BACKEND_DIR/scripts/kill-linker-processes.sh"
      trap '"$$BACKEND_DIR/scripts/kill-linker-processes.sh"; rm -rf "$$WORKDIR"' EXIT
      buildkite-agent artifact download build_id "$$WORKDIR/"
      BUILD_ID="$$(cat "$$WORKDIR/build_id")"
      test -n "$$BUILD_ID"
      # JestRepos seed: immer only. Skip javascript-algorithms/babel/redwood/gatsby.
      # ImmerPin v9.0.12 — immer main is vitest-era / no .bin/jest.
      # Owners ship yarn.lock; agents lack yarn → npx yarn. Fresh mktemp seed each job.
      mkdir -p "$$WORKDIR/jest"
      JEST_IMMER="$$WORKDIR/jest/immer"
      git clone --depth 1 --branch v9.0.12 https://github.com/immerjs/immer.git "$$JEST_IMMER"
      npx --yes yarn@1.22.22 --cwd "$$JEST_IMMER" install --frozen-lockfile --non-interactive
      test -x "$$JEST_IMMER/node_modules/.bin/jest"
      cd "$$BACKEND_DIR"
      unset REPLAY_LOCAL_DRIVER_DIR || true
      # packageManager pnpm@10.11.0; can_replay agents lack global npm write (EACCES).
      # Backend k8s image preinstalls pnpm; here use npx (Node 25 dropped corepack).
      npx --yes pnpm@10.11.0 install --frozen-lockfile
      export RECORD_REPLAY_ENABLE_ASSERTS=1
      export RECORD_REPLAY_JS_PROGRESS_ASSERTS=1
      npx tsx src/build/buildNode.ts test-jest-repos --build-id "$$BUILD_ID"
