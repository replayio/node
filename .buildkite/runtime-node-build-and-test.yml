# NodeBKWiring build/test steps (PipelineYamlHome).
# Emitted by replay_build_scripts/build-pipeline.py (bakes pin SHA from
# node REPLAY_BACKEND_REV into the PIN_TOKEN placeholders).
# ${BUILDKITE_*} remain for Buildkite interpolation at PipelineUpload.
#
# Scratch dirs: mktemp under /tmp (BK agents are partially stateful).
# Do not parallel-clone node into a BK artifact — different agents cannot share
# disk; tar upload/download of the tree is pure waste. build_node_builder clones.
#
# NodeRepo: host checkout+out mounted over the image node path so make can
# incremental-rebuild across jobs on the same agent. Mounting only out/ is not
# enough — a fresh image COPY of sources resets mtimes and forces a full rebuild.
# Do not `git fetch --depth 1` the cached NodeRepo — shallow fetch rewrites the
# tree and bumps gyp input mtimes → make "Regenerating Makefile" → near-full rebuild.
# reclaim_node_repo chown -R bumps ctime on every file; with default git stat
# checks that dirties the whole tree and `checkout -f` rewrites all sources.
# core.trustctime=false + update-index --refresh after chown keeps mtimes.
steps:
  - trigger: "build-driver-linker"
    key: "build-driver-linker"
    build:
      commit: "__REPLAY_BACKEND_REV__"
      message: "Triggered from node: ${BUILDKITE_MESSAGE}"

  # Throwaway pipeline: resets the NodeRepo shared by branches that predate the
  # per-version cache (claude/node-repo-cache-per-version). A 16.20.3 build left
  # out/Makefile generated from its .gyp files, so 16.14.3 builds fail with
  # "No rule to make target '../deps/base64/base64.gyp'". Deleting out/ makes the
  # next build reconfigure (buildNodeDirectly does when out/Makefile is missing).
  - label: ":broom: Reset shared NodeRepo out/"
    key: "reset-shared-node-repo-out"
    depends_on:
      - "build-driver-linker"
    agents:
      - "build-runtime=true"
    command: |
      set -euo pipefail
      NODE_REPO="/var/lib/buildkite-agent/cache/runtime-node-build/repo"
      echo "=== Agent $${BUILDKITE_AGENT_NAME:-?} on $$(hostname) ==="
      if [ ! -d "$$NODE_REPO/out" ]; then
        echo "No $$NODE_REPO/out; nothing to reset"
        exit 0
      fi
      echo "HEAD=$$(git -C "$$NODE_REPO" rev-parse HEAD 2>/dev/null || echo none)"
      grep -o '\$$(srcdir)/deps/base64/base64.gyp' "$$NODE_REPO/out/Makefile" 2>/dev/null | head -n1 || true
      du -sh "$$NODE_REPO/out" || true
      # Builds chown the tree back to the agent on exit, but fall back to root
      # (via the builder image) if a killed build left root-owned files behind.
      if ! rm -rf "$$NODE_REPO/out"; then
        docker run --rm -v "$$NODE_REPO:/repo" --entrypoint rm linux-node-build -rf /repo/out
      fi
      test ! -e "$$NODE_REPO/out"
      echo "Removed $$NODE_REPO/out"
